<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunflower Calendar</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="A beautiful shared calendar for couples" />
    <meta name="theme-color" content="#F59E0B" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calendar" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="Sunflower Calendar" />
    <meta property="og:description" content="A beautiful shared calendar for couples" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('SW registered'))
            .catch(err => console.log('SW registration failed'));
        });
      }
    </script>
  </body>
</html>
